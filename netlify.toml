# Netlify Configuration for Static Portfolio

[build]
  # Directory that contains the deploy-ready HTML files and assets
  publish = "."

# Form handling & spam prevention
[forms]
  # Netlify automatically processes HTML forms with data-netlify="true"

# Recommended Security and Caching Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
